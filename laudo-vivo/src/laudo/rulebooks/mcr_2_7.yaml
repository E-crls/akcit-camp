  - id: OP-bovinos-contagem-tolerancia
    item: "operacional"
    tipo: criterio_status
    origem: parametro_operacional
    titulo: "Contagem de bovinos com intervalo contra a quantidade financiada"
    justificativa: >-
      A norma pede verificar a aplicação do crédito (MCR 2-7-2-a-I e 2-5-10) e não fixa como contar. A contagem
      (vídeo ou manual) traz um intervalo [inferior, superior]. Com Q financiado e tolerância t, o limite é
      L = Q × (1 − t). Se inferior ≥ L, verifica. Se superior < L, diverge. Se o intervalo cruza L, fica
      inconclusiva e pendente. Contagem que se abstém nunca vira divergência.
    base_normativa: ["MCR 2-7-1-c", "MCR 2-7-2-a-I", "MCR 2-7-9", "MCR 2-5-10-b"]
    aplica_a: [bovinos]
    avaliador: contagem_intervalo
    ferramentas: [contar_bovinos_video, contagem_manual]
    evidencias: [video]
    parametros: [PAR-contagem-tolerancia-pct, PAR-tentativas-inconclusivas-max]
    usado_por: [planejar_metodo, avaliar_regras]
    pedido: "vídeo do lote passando em fila pelo corredor/brete do curral, câmera parada, de cima se possível"
    criterios:
      verificado: "limite inferior do intervalo ≥ Q × (1 − tolerância) (no limite conta como dentro)"
      divergente: "limite superior do intervalo < Q × (1 − tolerância)"
      pendente: "intervalo cruza o limite, contagem abstida/indeterminada, erro, sem vídeo ou contagens conclusivas conflitantes"
      abstencao: "inconclusiva após o máximo de tentativas"

  - id: OP-bovinos-gta
    item: "operacional"
    tipo: requisito_evidencia
    origem: parametro_operacional
    titulo: "GTA da compra dos animais conciliada com NF-e e item"
    justificativa: >-
      A GTA não está no MCR. Ela é exigida pela defesa sanitária animal para o trânsito de bovinos (fonte
      secundária, não verificada nesta sessão) e é a prova que falta nos casos conhecidos como "boi de papel" (GTA
      falsa, rebanho inexistente). O MCR 2-5-10-b pede documentos comprobatórios da aquisição. Exigimos a GTA
      como um deles, conciliada em espécie, quantidade, origem/destino e data.
    base_normativa: ["MCR 2-5-10-b", "MCR 3-3-10-a"]
    aplica_a: [bovinos]
    avaliador: status_checagem
    ferramentas: [conciliar_gta]
    evidencias: [gta]
    parametros: [PAR-tentativas-inconclusivas-max]
    usado_por: [planejar_metodo, avaliar_regras]
    pedido: "GTA da compra (foto legível ou PDF), com espécie, quantidade, origem e destino"
    criterios:
      verificado: "GTA confere com NF-e e item"
      divergente: "GTA não confere (quantidade, destino, data)"
      pendente: "sem GTA, ilegível, erro ou requisito ausente"
      abstencao: "ilegível após o máximo de tentativas"

