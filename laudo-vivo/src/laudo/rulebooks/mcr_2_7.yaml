    tipo: requisito_metodo
    origem: norma
    titulo: "IF pode contratar pessoas especializadas, sem perder a responsabilidade"
    citacao: "a instituição financeira pode contratar pessoas especializadas para a execução de seus trabalhos de monitoramento e fiscalização"
    aplica_a: [operacao]

  - id: MCR-2-7-item15-independencia-fiscal
    item: "MCR 2-7-15"
    tipo: requisito_laudo
    origem: norma
    titulo: "Fiscal independente do mutuário (vedação)"
    citacao: "por pessoa física ou jurídica contratada diretamente pelo mutuário para a prestação de assistência técnica ao empreendimento"
    citacoes_adicionais:
      - "b) por empresa da qual o mutuário participe direta ou indiretamente"
    resumo: >-
      A vedação é norma. O meio de prova (declaração do fiscal no app, evidência tipo 'declaracao' com
      meta.assunto = 'independencia_fiscal' e meta.conflito = false) é escolha nossa.
    aplica_a: [laudo]
