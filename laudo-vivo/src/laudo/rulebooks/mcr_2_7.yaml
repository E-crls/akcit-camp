      divergente: "estrutura ausente ou inacabada"
      pendente: "sem checagem, erro, conflito entre checagens ou inconclusiva (pedir nova foto)"
      abstencao: "inconclusiva após o máximo de tentativas"

  - id: OP-evidencia-integridade-foto
    item: "operacional"
    tipo: criterio_status
    origem: parametro_operacional
    titulo: "Integridade da foto (EXIF, GPS, horário, duplicata, foto de tela)"
    justificativa: >-
      O MCR 2-7 não fixa requisitos de foto, mas exige critérios verificáveis (item 1-c). Uma foto sem EXIF,
      reaproveitada ou fotografada de uma tela não prova a benfeitoria. Basta uma foto adulterada para marcar
      divergência, e o humano decide (agregação qualquer_divergente).
    base_normativa: ["MCR 2-7-1-c", "MCR 2-7-1-d"]
    aplica_a: [cerca, curral, galpao]
    avaliador: status_checagem
    agregacao: qualquer_divergente
    ferramentas: [integridade_foto]
    evidencias: [foto]
    parametros: [PAR-tentativas-inconclusivas-max]
    usado_por: [avaliar_regras]
    pedido: "capturar a foto pelo app (com EXIF e GPS), sem reaproveitar imagem"
    criterios:
      verificado: "todas as fotos íntegras, ou a falha de captura foi superada por foto íntegra posterior"
      divergente: "alguma foto duplicada, de tela ou com metadados incoerentes"
      pendente: "sem checagem de integridade ou foto sem EXIF (capturar no app)"
      abstencao: "inconclusiva após o máximo de tentativas"

  - id: OP-benfeitoria-geofence
    item: "operacional"
    tipo: criterio_status
    origem: parametro_operacional
    titulo: "Foto georreferenciada dentro ou perto da gleba"
    justificativa: >-
      A localização liga a foto ao empreendimento financiado (MCR 2-7-2-a-I). A norma não fixa distância.
      Usamos três faixas: até PAR-geofence-perto-m verifica, até PAR-geofence-longe-m fica pendente
      (refazer ou justificar) e acima disso diverge. Basta uma foto muito longe para marcar divergência.
      Na faixa intermediária a posição foi medida com precisão: é pendência resolvível por nova captura ou
      justificativa do fiscal, nunca abstenção (que fica para GPS impreciso ou indeterminado).
    base_normativa: ["MCR 2-7-2-a-I", "MCR 2-7-3-c"]
    aplica_a: [cerca, curral, galpao]
    avaliador: geofence_distancia
    agregacao: qualquer_divergente
    ferramentas: [geofence]
    evidencias: [foto]
    parametros: [PAR-geofence-perto-m, PAR-geofence-longe-m, PAR-tentativas-inconclusivas-max]
    usado_por: [avaliar_regras]
    pedido: "foto da benfeitoria tirada de dentro da gleba (ou a até 100 m da borda), com GPS ligado"
    criterios:
      verificado: "dentro da gleba, ou fora a até PAR-geofence-perto-m da borda"
      divergente: "fora a mais de PAR-geofence-longe-m da borda"
      pendente: "fora entre as duas distâncias (nova captura ou justificativa do fiscal; quantas capturas forem), GPS impreciso (indeterminado) abaixo do máximo de tentativas, ou sem checagem"
      abstencao: "GPS impreciso/indeterminado após o máximo de tentativas (nunca a faixa intermediária medida)"

