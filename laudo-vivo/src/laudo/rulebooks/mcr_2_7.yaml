  # ------------------------------------- custeio de aquisição e manutenção de animais (perfil, 0.4.0)
  - id: OP-perfil-custeio-animais
    item: "operacional"
    tipo: requisito_metodo
    origem: parametro_operacional
    titulo: "Perfil custeio de aquisição e manutenção de animais: o método documentado pela IF"
    justificativa: >-
      O MCR 2-7 não tem alínea própria para o custeio pecuário: o item 16 trata de benfeitorias, máquinas e
      insumos a cooperados. O item 1 deixa à IF "definir os procedimentos aplicados" e o 1-c exige critérios
      e métodos consistentes, verificáveis e avaliáveis pelo BCB. Este perfil é esse procedimento, escrito e
      versionado: para operação de custeio com item de bovinos (compra para recria/engorda e manutenção do
      lote), as mesmas checagens do investimento (contagem com a mesma tolerância, NF-e e GTA da aquisição
      conciliadas) mais a lotação do lote na área (sinal não bloqueante, OP-custeio-lotacao). O animal é bem
      móvel e fungível e o custeio não deixa benfeitoria para fotografar: a prova é o lote no curral, a nota
      e o trânsito. Item só de manutenção (sem compra) não tem NF-e nem GTA de aquisição; os comprovantes de
      insumos ficam retidos pelo produtor (MCR 2-5-10-a). O laudo registra o método por item
      (MCR-2-7-item1-metodo-documentado-if).
    base_normativa: ["MCR 2-7-1", "MCR 2-7-1-c", "MCR 2-7-1-d", "MCR 2-7-11-b", "MCR 2-5-10-a",
                     "MCR 2-5-10-b"]
    aplica_a: [bovinos]
    condicao:
      todas:
        - {campo: operacao.finalidade, op: eq, valor: custeio}
        - {campo: item.tipo, op: in, valor: [bovinos]}
    efeito:
      fluxo: custeio_animais
      metodo:
        contagem: >-
          vídeo do lote no corredor (contar_bovinos_video) ou contagem manual; intervalo contra Q × (1 −
          PAR-contagem-tolerancia-pct), só para menos (OP-bovinos-contagem-tolerancia)
        nfe: >-
          XML da NF-e de aquisição conciliado com o item (conciliar_nfe: NCM 01.02, quantidade, valor, data
          entre contratação e fiscalização, partes), quando o item é de aquisição
        gta: >-
          GTA conciliada com a NF-e e o item (conciliar_gta: espécie e sexo, quantidade, destino, origem,
          finalidade, data, grupo ZF da NF-e e índice de documentos de laudos selados), quando o item é de
          aquisição
        lotacao: >-
          cabeças do lote ÷ área de pasto contra PAR-custeio-lotacao-atencao-cab-ha (OP-custeio-lotacao):
          ponto de atenção, nunca divergência
        manutencao: >-
          item só de manutenção (descrição sem aquisição/compra): NF-e e GTA de compra não se aplicam;
          contagem e lotação continuam
    usado_por: [planejar_metodo, avaliar_regras]

  - id: MCR-2-7-item1-metodo-documentado-if
    item: "MCR 2-7-1-c"
    tipo: requisito_laudo
    origem: norma
    titulo: >-
      Procedimento definido pela IF, com critérios consistentes e verificáveis (método do perfil no laudo)
    citacao: >-
      a aplicação de critérios e métodos consistentes, verificáveis e passíveis de avaliação pelo Banco
      Central do Brasil
    citacoes_adicionais:
      - >-
        A instituição financeira é responsável pelo monitoramento e pela fiscalização das operações de
        crédito rural, cabendo-lhe definir os procedimentos aplicados
    resumo: >-
      Para o perfil sem alínea própria no 2-7 (custeio de animais), o laudo registra, por item, o método que a
      IF documentou: perfil, versão e sha256 do rulebook, checagens e parâmetros (item 1-c; o registro das
      verificações é o item 1-d). Não bloqueia: o método de campo já é exigido em laudo:metodo.
    aplica_a: [bovinos]
    avaliador: metodo_documentado
    efeito:
      perfil: OP-perfil-custeio-animais
      componentes: [contagem, nfe, gta, lotacao]
      # componente -> campo do fluxo custeio_animais que o executa: condição falsa = não se aplica ao item
      campos: {contagem: quantidade, nfe: comprovante_nfe, gta: gta, lotacao: lotacao}
    usado_por: [planejar_metodo, avaliar_regras]
    bloqueante: false
    pedido: >-
      registrar o método de fiscalização adotado (o método do perfil só vale com o método de campo
      registrado)
    criterios:
      verificado: "perfil com os componentes que se aplicam ao item documentados e método de campo registrado"
      pendente: "perfil sem algum componente documentado, ou método de campo não registrado (não bloqueia)"

  - id: OP-custeio-lotacao
    item: "operacional"
    tipo: criterio_status
    origem: parametro_operacional
    titulo: "Custeio de animais: lotação do lote na área (sinal para o fiscal, nunca divergência)"
    justificativa: >-
      No custeio de manutenção o lote vive no pasto da operação; cabeças demais para a área pedem atenção
      (área de pasto não informada, arrendamento, piquete rotacionado ou semiconfinamento) e o item 2-b-II do
      2-7 pede cruzamento de informações e indicadores de risco. A conta é a mesma da triagem
      (checar_lotacao) e o limiar é PAR-custeio-lotacao-atencao-cab-ha. Lotação alta não prova desvio: o
      campo fica pendente sem bloquear o laudo e não entra no status agregado do item.
    base_normativa: ["MCR 2-7-1-c", "MCR 2-7-2-b-II", "MCR 2-7-9"]
    aplica_a: [bovinos]
    avaliador: lotacao_sinal
    ferramentas: [checar_lotacao]
    parametros: [PAR-custeio-lotacao-atencao-cab-ha]
    bloqueante: false
    usado_por: [planejar_metodo, avaliar_regras]
    pedido: "confirmar a área de pasto que recebe o lote (piquetes, arrendamento ou semiconfinamento)"
    criterios:
      verificado: >-
        lotação ≤ PAR-custeio-lotacao-atencao-cab-ha, ou confinamento (lotação por área não se aplica)
      pendente: >-
        lotação acima do parâmetro, ou sem área para calcular (ponto de atenção; não bloqueia nem entra no
        status do item)

  # --------------------------------------------------- consequências (humano)
  - id: MCR-2-7-item21-comunicacao-ilicitos
    item: "MCR 2-7-21"
    tipo: requisito_laudo
    origem: norma
    titulo: "Ilícito penal ou fraude fiscal: IF comunica MP/autoridade tributária"
    citacao: "deve a instituição financeira comunicar os fatos ao Ministério Público ou às autoridades tributárias"
    resumo: "Informativa: decisão humana da IF; o agente nunca qualifica fato como ilícito."
    aplica_a: [operacao]
    efeito: {decisao_humana: true}

  - id: MCR-2-7-item23-guarda-documentacao
    item: "MCR 2-7-23"
    tipo: requisito_laudo
    origem: norma
    titulo: "Documentação da fiscalização à disposição do BCB"
    citacao: "manter a documentação gerada no processo de fiscalização e monitoramento à disposição do Banco Central do Brasil"
    resumo: "Atendida pela trilha append-only com hash (área de auditoria)."
    aplica_a: [laudo]

  - id: MCR-2-8-item2-aplicacao-nao-comprovada
    item: "MCR 2-8-2-i"
    tipo: requisito_laudo
    origem: norma
    titulo: "Aplicação não comprovada pode levar à desclassificação"
    citacao: "i) aplicação não comprovada de recursos"
    resumo: "Informativa: campo divergente/pendente informa a IF; desclassificar é decisão humana (MCR 2-7-19)."
    aplica_a: [operacao]
    efeito: {decisao_humana: true}

  - id: MCR-2-8-item3-prazo-desclassificacao
    item: "MCR 2-8-3"
    tipo: prazo
    origem: norma
    titulo: "Desclassificação em até 60 dias da ciência do fato"
    citacao: "em até 60 (sessenta) dias a contar da data em que ficou ciente do fato passível de ser caracterizado como irregularidade"
    resumo: "Informativa: prazo da IF depois do laudo assinado."
    aplica_a: [operacao]

  # ------------------------------------------------ agregação e abstenção
  - id: OP-status-mapeamento-checagem
    item: "operacional"
    tipo: criterio_status
    origem: parametro_operacional
    titulo: "Como checagens viram status de campo"
    justificativa: >-
      Ferramentas devolvem ok/divergente/indeterminado/erro. O campo precisa de um status do laudo. A
      ferramenta calcula e a regra decide, com critério explícito para que o mesmo estado sempre dê o mesmo
      laudo (MCR 2-7-1-c).
    base_normativa: ["MCR 2-7-1-c"]
    aplica_a: [bovinos, cerca, curral, galpao, maquina, laudo]
    avaliador: status_checagem
    efeito:
      checagem: {ok: verificado, divergente: divergente, indeterminado: inconclusivo, erro: erro}
      requisitos_ausentes: inconclusivo
    criterios:
      verificado: "todas as checagens conclusivas são ok (e nenhuma divergente)"
      divergente: "consenso: todas as conclusivas divergentes; qualquer_divergente: ao menos uma divergente"
      pendente: "nenhuma checagem; só erro; inconclusiva abaixo do máximo de tentativas; conclusivas conflitantes (consenso)"
      abstencao: "só inconclusivas, em número ≥ PAR-tentativas-inconclusivas-max"

  - id: OP-alegacao-declaracao-x-evidencia
    item: "operacional"
    tipo: requisito_laudo
    origem: parametro_operacional
    titulo: "Alegação da fala × evidência, com a origem de cada valor"
    justificativa: >-
      O laudo precisa registrar as verificações realizadas com critério verificável (MCR 2-7-1-c e 1-d). O que a
      fiscal disse no campo ("contei 29", "a cerca tem 800 m") é declaração, não prova: o laudo mostra cada
      alegação ao lado da evidência que a confronta (vídeo, NF-e, projeto, outra declaração) e o status da
      confrontação (confere, divergente, pendente, registro, sem evidência), sem mudar o status de campo nenhum
      (quem decide é o verificador). Cada valor apurado diz de onde veio: XML autorizado, lido de foto e validado
      por dígito verificador/somas, lido de foto e completado pela fiscal (validado pelas mesmas regras), vídeo,
      satélite ou declaração. Divergência entre alegação e evidência pede justificativa no texto do laudo.
    resumo: "Informativa (não executada pelo avaliar_regras): lida por conciliar_alegacoes e mostrada na seção alegações × evidência do laudo."
    base_normativa: ["MCR 2-7-1-c", "MCR 2-7-1-d", "MCR 2-7-2-a-I"]
    aplica_a: [laudo]
    ferramentas: [conciliar_alegacoes]
    bloqueante: false
    criterios:
      confere: "a alegação bate com a evidência (dentro do intervalo da contagem, igual à NF-e, ≥ projeto)"
      divergente: "a alegação não bate com a evidência, ou duas declarações não batem: o laudo mostra as duas"
      pendente: "declaração contra o projeto sem evidência física que resolva (ex.: obra declarada incompleta)"
      registro: "menção a item não financiado ou número sem objeto financiado: registrada, não confrontada"
      sem_evidencia: "ainda não há checagem para confrontar"

  - id: OP-agregacao-item
    item: "operacional"
    tipo: criterio_status
    origem: parametro_operacional
    titulo: "Status do item = pior status entre seus campos"
    justificativa: >-
      Um item só fica verificado quando todas as exigências bloqueantes estão verificadas. A precedência é
      divergente > pendente > abstenção > verificado: a divergência é o achado mais relevante para a IF e
      precisa de justificativa humana (POL-02). Desde a 0.4.0, campo de regra não bloqueante (lotação, método
      do perfil de custeio) aparece no valor do item, mas não decide o status dele; se estiver pendente, o
      motivo do item diz "ponto de atenção não bloqueante" em vez de "todas as exigências verificadas".
    base_normativa: ["MCR 2-7-1-d"]
    aplica_a: [bovinos, cerca, curral, galpao, maquina]
    avaliador: agregacao_item
    efeito: {precedencia: [divergente, pendente, abstencao, verificado]}
    criterios:
      verificado: >-
        todos os campos bloqueantes do item verificados (ponto de atenção não bloqueante pendente aparece no
        motivo do item)
      divergente: "algum campo bloqueante divergente"
      pendente: "algum campo bloqueante pendente e nenhum divergente"
      abstencao: "algum campo bloqueante em abstenção, nenhum pendente ou divergente"

  - id: OP-escopo-itens-regional
    item: "operacional"
    tipo: requisito_laudo
    origem: parametro_operacional
    titulo: "Item sem fluxo no rulebook bloqueia o laudo (default-deny)"
    justificativa: >-
      O rulebook do regional cobre bovinos, cerca/curral/galpão e máquina. Um item financiado de outro tipo
      (lavoura, pastagem, outro) não pode ser dado como comprovado sem regra, então bloqueia até haver regra
      ou decisão humana registrada.
    base_normativa: ["MCR 2-7-1-a"]
    aplica_a: [lavoura, pastagem, outro]
    avaliador: escopo
    usado_por: [avaliar_regras]
    pedido: "item fora do escopo do rulebook: registrar verificação humana ou aguardar rulebook específico"
    criterios:
      pendente: "item financiado sem fluxo de regras"

fluxos:
  bovinos:
    descricao: "Aquisição de bovinos (investimento semifixo, MCR 3-3-3-a)"
    tipos_item: [bovinos]
    campos:
      - {campo: quantidade, regra: OP-bovinos-contagem-tolerancia}
      - {campo: comprovante_nfe, regra: MCR-2-5-item10-comprovante-aquisicao}
      - {campo: gta, regra: OP-bovinos-gta}
  # 0.4.0: escolhido por OP-perfil-custeio-animais (operação de custeio); nunca por tipo de item sozinho.
  custeio_animais:
    descricao: >-
      Custeio de aquisição e manutenção de animais (OP-perfil-custeio-animais; método documentado pela IF,
      MCR 2-7-1-c)
    tipos_item: [bovinos]
    campos:
      - {campo: quantidade, regra: OP-bovinos-contagem-tolerancia}
      - campo: comprovante_nfe
        regra: MCR-2-5-item10-comprovante-aquisicao
        condicao: {campo: item.aquisicao, op: eq, valor: true}
      - campo: gta
        regra: OP-bovinos-gta
        condicao: {campo: item.aquisicao, op: eq, valor: true}
      - {campo: lotacao, regra: OP-custeio-lotacao}
      - {campo: metodo_if, regra: MCR-2-7-item1-metodo-documentado-if}
  benfeitoria:
    descricao: "Construção/reforma de benfeitorias (MCR 2-7-16-a; investimento fixo, MCR 3-3-2-a)"
    tipos_item: [cerca, curral, galpao]
    campos:
      - {campo: integridade_foto, regra: OP-evidencia-integridade-foto}
      - {campo: localizacao, regra: OP-benfeitoria-geofence}
      - {campo: conclusao, regra: MCR-2-7-item16-benfeitorias-conclusao}
      - {campo: prazo_cronograma, regra: MCR-2-7-item16-benfeitorias-cronograma}
  maquina:
    descricao: "Aquisição de máquinas e equipamentos (MCR 2-7-16-b)"
    tipos_item: [maquina]
    campos:
      - {campo: prazo_60d, regra: MCR-2-7-item16-maquinas-60d}
      - {campo: nfe, regra: MCR-2-7-item16-maquinas-nfe}
      - campo: numero_serie
        regra: MCR-2-7-item16-maquinas-numero-serie
        condicao: {campo: item.exige_numero_serie, op: eq, valor: true}

campos_laudo:
  - {campo: "laudo:metodo", regra: MCR-2-7-item1-registro-verificacoes}
  - {campo: "laudo:independencia_fiscal", regra: MCR-2-7-item15-independencia-fiscal}
  - {campo: "laudo:sensoriamento_remoto", regra: MCR-2-7-item5-remoto-obrigatorio-300ha}
  - {campo: "laudo:metadados_sensoriamento", regra: MCR-2-7-item4-metadados-sr}
