# Rulebook MCR 2-7 (Monitoramento e Fiscalização), Res. CMN 5.267/2025.
# Esquema: src/laudo/rulebooks/__init__.py. Versionamento e revisão: docs/regras.md.
# Texto literal das normas citadas: docs/normas/mcr_2_7.md (conferido por teste).
#
# Convenções:
#   origem: norma                 -> o que a norma manda; `citacao` literal obrigatória.
#   origem: parametro_operacional -> escolha nossa para tornar a norma executável; `justificativa` obrigatória.
#   avaliador: nulo               -> regra informativa (citável, não executada).
#   Data de referência sempre explícita (nunca "hoje" implícito dentro da regra).
#
# Histórico:
#   0.5.0 (16/10/2026, onda 3, antes da r4): (1) novo parâmetro PAR-pacote-prazo-contestacao-dias (15 dias
#         corridos para o mutuário contestar o laudo selado no pacote de exibição; escolha da IF, pendência de
#         compliance), que era só uma constante de tools/pacote.py. (2) Perfil de custeio: o plano
#         (planejar_metodo) lista só os componentes do método que se aplicam ao item, como o campo metodo_if
#         do laudo já fazia; item só de manutenção não lista NF-e nem GTA de compra. (3) Pendente de regra não
#         bloqueante (lotação, método do perfil) continua "pendente", mas sai marcado à parte: ressalva "não
#         bloqueante", motivo terminando em "(não bloqueia o laudo)" e lista `nao_bloqueantes` no resultado do
#         avaliar_regras, fora de `bloqueios`. (4) OP-agregacao-item: o texto diz "exigências bloqueantes"
#         (o item pode ficar verificado com ponto de atenção pendente, e o motivo do item diz isso). Nenhum
#         status de caso de teste muda.
#   0.4.0 (16/10/2026, cunha "operações com animais"): novo perfil OP-perfil-custeio-animais (custeio de
#         aquisição e manutenção de animais), escolhido por item quando operacao.finalidade = custeio e o item
#         é de bovinos; fluxo custeio_animais com as mesmas checagens do investimento (contagem, NF-e e GTA da
#         aquisição) mais a lotação (OP-custeio-lotacao, sinal não bloqueante) e o método documentado pela IF
#         (MCR-2-7-item1-metodo-documentado-if, item 1-c, citação literal). Item só de manutenção (sem
#         aquisição) não exige NF-e nem GTA de compra. Novo parâmetro PAR-custeio-lotacao-atencao-cab-ha. A
#         marcação dos animais (MCR 3-3-10-b, investimento) deixa de ser recomendada em operação de custeio.
#         Operações de investimento ou sem finalidade conhecida: nenhum status muda (mesmo fluxo bovinos).
#         Revisão de 16/10 (antes da r4): o método do item lista só os componentes que se aplicam a ele
#         (`efeito.campos` liga cada componente ao campo do fluxo; item só de manutenção não lista NF-e nem
#         GTA).
#   0.3.0 (09/10/2026, rodada 3): (1) OP-benfeitoria-geofence: foto fora da gleba com posição medida entre
#         PAR-geofence-perto-m e PAR-geofence-longe-m é PENDENTE (nova captura de dentro da gleba ou justificativa
#         do fiscal), não "inconclusiva": duas capturas consistentes nessa faixa não viram abstenção; abstenção
#         fica para GPS impreciso/indeterminado (PAR-tentativas-inconclusivas-max). A justificativa do fiscal
#         resolve a pendência (o campo continua pendente no laudo, com as palavras dele). (2) Nova regra
#         OP-alegacao-declaracao-x-evidencia: o laudo confronta cada alegação da fala com a evidência e diz a
#         origem de cada valor (XML, foto validada, completado pela fiscal, vídeo, satélite); não muda status.
#         (3) MCR-2-7-item16-benfeitorias-conclusao: classificar_foto só conta se a classe da foto for a do item.
#   0.2.0 (08/10/2026, integração): na agregação `qualquer_divergente` (integridade e localização da foto), uma
#         captura inconclusiva só é superada por uma captura verificada POSTERIOR (foto duplicada na mesma
#         fiscalização deixa o campo pendente, como decidido pelo coordenador; a foto refeita de dentro da gleba
#         resolve a anterior). Checagem com `resultado.substitui` (NF-e/GTA reconciliadas com todos os documentos
#         do item) tira as substituídas da agregação.
#   0.1.0 (08/10/2026): versão inicial.

id: mcr-2-7
titulo: "MCR 2-7 — Monitoramento e Fiscalização (fluxo do regional: operações com animais)"
versao: 0.5.0
vigencia_inicio: 2026-03-01
vigencia_fim: null
norma_base: "Resolução CMN nº 5.267, de 28/11/2025 (DOU 01/12/2025), anexo — nova Seção 7 do Capítulo 2 do MCR"
texto_normativo: docs/normas/mcr_2_7.md

fontes:
  - id: res-5267
    descricao: "Resolução CMN nº 5.267/2025 (texto oficial, API de normativos do BCB)"
    url: "https://www.bcb.gov.br/estabilidadefinanceira/exibenormativo?tipo=Resolu%C3%A7%C3%A3o%20CMN&numero=5267"
    acesso: 2026-10-08
  - id: mcr-sgm
    descricao: "MCR vigente no Sistema de Gestão de Manuais do BCB (seções 2-2, 2-5, 2-7, 2-8, 3-3)"
    url: "https://manuais.bcb.gov.br/app/manual/mcr/publico"
    acesso: 2026-10-08
    observacao: "Seção 2-7 com cabeçalho 'Resolução CMN nº 5.267'; nenhuma resolução até a 5.343 altera o 2-7."

revisao:
  estado: rascunho_tecnico
  revisores: []
  pendencias:
    - "Agrônomo/compliance: validar tolerância de contagem (PAR-contagem-tolerancia-pct) e o uso só para menos."
    - "Compliance: validar o enquadramento de 'autofiscalização assistida' como método documental (item 3-b)."
    - "Compliance: confirmar se 'área total' (item 5-b) pode ser aproximada pela área financiada do Sicor."
    - "Agrônomo: calibrar distâncias de geofence para curral na sede, fora da gleba financiada."
    - "Jurídico: confirmar a fonte sanitária da GTA (fora do MCR) e os campos mínimos de conciliação."
    - >-
      Compliance: validar o perfil de custeio de animais (OP-perfil-custeio-animais) como o método
      documentado pela IF (item 1-c).
    - >-
      Agrônomo: calibrar PAR-custeio-lotacao-atencao-cab-ha (recria/engorda a pasto, semiconfinamento) e o
      critério de item só de manutenção.
    - >-
      Compliance/jurídico: confirmar PAR-pacote-prazo-contestacao-dias (15 dias corridos da ciência) e a forma
      da ciência do mutuário no termo do pacote de exibição; o MCR não fixa prazo de contestação.

parametros:
  - id: PAR-contagem-tolerancia-pct
    valor: 5
    unidade: "%"
    justificativa: >-
      A norma não fixa tolerância de contagem (MCR 2-7-1-c pede critérios consistentes e verificáveis).
      Contagem em curral/corredor tem erro de alguns por cento (animais sobrepostos, refugo, bezerro ao pé).
      Aplicamos a tolerância só para baixo: encontrar mais animais que o financiado não indica desvio na
      aplicação, porque o rebanho próprio pode estar no mesmo lote. Valor inicial, a calibrar no golden set.
    base_normativa: ["MCR 2-7-1-c", "MCR 2-7-2-a-I"]
    calibrar: "golden set de vídeos anotados; meta de falso divergente < 2%"
  - id: PAR-tentativas-inconclusivas-max
    valor: 2
    unidade: "tentativas"
    justificativa: >-
      Depois de duas checagens inconclusivas do mesmo campo (ex.: contagem com oclusão), o sistema deixa de
      pedir nova coleta e se abstém, devolvendo a decisão ao humano. Isso evita o laço infinito de refilmagem
      e o "recontar até passar".
    base_normativa: ["MCR 2-7-10"]
  - id: PAR-geofence-perto-m
    valor: 100
    unidade: "m"
    justificativa: >-
      Distância máxima entre a foto e a borda da gleba para aceitá-la como do empreendimento. Cobre o erro de
      GPS de celular (5 a 30 m) e cercas na divisa fotografadas do lado de fora. A norma não fixa distância.
    calibrar: "fotos reais de cerca/curral em Goiás; checar curral na sede fora da gleba do Sicor"
  - id: PAR-geofence-longe-m
    valor: 1000
    unidade: "m"
    justificativa: >-
      Acima desta distância da gleba, a foto é tratada como divergente (provável outra estrutura/imóvel). Entre
      PAR-geofence-perto-m e este valor, o campo fica pendente: refazer a foto ou justificar (ex.: curral na
      sede). Assim evitamos acusar divergência por imprecisão de polígono. A pendência dessa faixa não conta
      como captura inconclusiva (a posição foi medida): não leva à abstenção (rulebook 0.3.0).
  - id: PAR-area-total-usa-financiada
    valor: true
    justificativa: >-
      O Sicor público traz a área financiada, não a "área total" do item 5-b. Sem a área total, há dois casos.
      Se a financiada passa de 300 ha, a obrigatoriedade é certa, porque a área total é maior ou igual à
      financiada. Se fica em até 300 ha, este parâmetro manda usar a financiada como aproximação e emitir
      aviso. A aproximação pode subestimar a obrigatoriedade. Com o parâmetro em false, o caso fica
      indeterminado e o campo vira pendente até alguém informar a área total.
    base_normativa: ["MCR 2-7-5-b"]
  - id: PAR-custeio-lotacao-atencao-cab-ha
    valor: 3
    unidade: "cab/ha"
    justificativa: >-
      Lotação (cabeças do lote financiado por hectare de pasto) acima da qual o custeio de aquisição e
      manutenção de animais vira ponto de atenção do fiscal. É o mesmo limiar da triagem da carteira para
      custeio (geo/triagem.py, lot_cust_1 = 3 cab/ha), para que triagem e laudo falem a mesma língua. A norma
      não fixa lotação: o valor só gera pendência não bloqueante (confirmar piquetes, arrendamento ou
      semiconfinamento), nunca divergência. A área usada é a informada; sem ela, a financiada (que é
      proporcional ao crédito, não é o pasto), com aviso.
    base_normativa: ["MCR 2-7-1-c", "MCR 2-7-2-b-II", "MCR 2-7-9"]
    calibrar: "dev do perfil custeio e casos reais de recria/engorda em GO (meta: sinal em < 20% dos válidos)"
  - id: PAR-pacote-prazo-contestacao-dias
    valor: 15
    unidade: "dias corridos"
    justificativa: >-
      Prazo que o pacote de exibição dá ao mutuário para contestar o resultado do laudo selado, contado da
      data da ciência registrada no termo (tools/pacote.py, PRAZO_CONTESTACAO_DIAS). O MCR não fixa prazo de
      contestação: o 2-8-3 dá à IF até 60 dias, contados da data em que ficou ciente do fato, para adotar as
      medidas da desclassificação, e o 2-7-18 diz quando o mutuário pode ser responsabilizado pelas despesas
      da fiscalização. Quinze dias deixam à IF tempo para examinar a contestação dentro desses 60 dias; a
      contestação aceita vira nova fiscalização, com nova evidência e nova assinatura humana (o laudo selado
      não muda). É escolha operacional da IF, não direito do mutuário previsto no MCR: pendência de
      compliance/jurídico em revisao.pendencias.
    base_normativa: ["MCR 2-8-3", "MCR 2-7-18"]
    calibrar: "compliance/jurídico da IF: prazo e forma da ciência (o pacote aceita de 5 a 60 dias)"

regras:
  # ------------------------------------------------------------------ método
  - id: MCR-2-7-item1-registro-verificacoes
    item: "MCR 2-7-1-c e 2-7-1-d"
    tipo: requisito_laudo
    origem: norma
    titulo: "Método e verificações registrados"
    citacao: "d) o necessário registro das verificações realizadas"
    citacoes_adicionais:
      - "a aplicação de critérios e métodos consistentes, verificáveis e passíveis de avaliação pelo Banco Central do Brasil"
    resumo: "O laudo precisa registrar o método adotado e cada verificação feita (item → evidência → checagem)."
    aplica_a: [laudo]
    avaliador: metodo_registrado
    usado_por: [avaliar_regras]
    pedido: "registrar o método de fiscalização adotado (remoto, documental, presencial ou autofiscalização assistida)"
    criterios:
      verificado: "fiscalização com método registrado"
      pendente: "método não registrado"

  - id: MCR-2-7-item3-metodos-admitidos
    item: "MCR 2-7-3"
    tipo: requisito_metodo
    origem: norma
    titulo: "Métodos admitidos: sensoriamento remoto, documental e presencial"
    citacao: "é admitido o uso dos seguintes métodos de análise, de forma individual ou combinada em uma mesma operação"
    citacoes_adicionais:
      - "b) documental, que consiste na análise de documentação comprobatória"
      - "c) presencial, que consiste no exame do empreendimento no local onde se desenvolve a atividade financiada ou onde se encontra o bem ou o produto financiado"
    aplica_a: [operacao]
    efeito: {metodos_admitidos: [remoto, documental, presencial]}
    usado_por: [planejar_metodo]

  - id: OP-metodo-autofiscalizacao-enquadramento
    item: "operacional"
    tipo: requisito_metodo
    origem: parametro_operacional
    titulo: "Autofiscalização assistida = método documental"
    justificativa: >-
      A norma admite três métodos (item 3) e não fala em autofiscalização. A captura guiada pelo produtor no
      app (foto/vídeo com integridade, GPS e hash) é documentação comprobatória analisada pela IF ou pela
      credenciada. Por isso a enquadramos como documental (item 3-b). Quem conclui é sempre o fiscal da IF,
      nunca o técnico contratado pelo mutuário (item 15). Interpretação a validar por compliance.
    base_normativa: ["MCR 2-7-3-b", "MCR 2-7-15"]
    aplica_a: [operacao]
    efeito: {enquadramento: {autofiscalizacao_assistida: documental, remoto: remoto, documental: documental, presencial: presencial}}
    usado_por: [planejar_metodo]

  - id: OP-metodo-escolha-por-item
    item: "operacional"
    tipo: requisito_metodo
    origem: parametro_operacional
    titulo: "Escolha do método por tipo de item e prioridade de verificação"
    justificativa: >-
      O item 1-b manda considerar a efetividade do procedimento "em vista das características do
      empreendimento". O satélite não prova o animal financiado (contagem por satélite é facultada, item 9),
      então bovinos de prioridade alta ou desconhecida vão para presencial. Benfeitoria e máquina admitem
      captura guiada. Em prioridade alta, tudo vai para presencial. A prioridade vem da triagem da carteira.
    base_normativa: ["MCR 2-7-1-b", "MCR 2-7-9", "MCR 2-7-10"]
    aplica_a: [bovinos, cerca, curral, galpao, maquina]
    efeito:
      ordem_rigor: [presencial, autofiscalizacao_assistida, documental, remoto]
      por_fluxo:
        bovinos: {alta: presencial, media: autofiscalizacao_assistida, baixa: autofiscalizacao_assistida, desconhecida: presencial}
        custeio_animais: {alta: presencial, media: autofiscalizacao_assistida,
                          baixa: autofiscalizacao_assistida, desconhecida: presencial}
        benfeitoria: {alta: presencial, media: autofiscalizacao_assistida, baixa: autofiscalizacao_assistida, desconhecida: autofiscalizacao_assistida}
        maquina: {alta: presencial, media: autofiscalizacao_assistida, baixa: autofiscalizacao_assistida, desconhecida: autofiscalizacao_assistida}
      escalonamento: "se o campo ficar inconclusivo após PAR-tentativas-inconclusivas-max, escalar para presencial"
    parametros: [PAR-tentativas-inconclusivas-max]
    usado_por: [planejar_metodo]

  # ---------------------------------------------------- sensoriamento remoto
  - id: MCR-2-7-item4-qualidade-imagens
    item: "MCR 2-7-4-a e 2-7-4-c"
    tipo: requisito_metodo
    origem: norma
    titulo: "Imagens com qualidade suficiente e captura conforme a finalidade"
    citacao: "as imagens utilizadas devem ter qualidade suficiente, determinada por parâmetros de resolução espacial, temporal, espectral e radiométrica"
    citacoes_adicionais:
      - "c) a captura das imagens deve ser efetuada conforme a finalidade das operações"
    aplica_a: [operacao]
    resumo: "Informativa: a adequação da imagem é responsabilidade da ferramenta de sensoriamento (serie_ndvi)."

  - id: MCR-2-7-item4-metadados-sr
    item: "MCR 2-7-4-b-I a III"
    tipo: requisito_laudo
    origem: norma
    titulo: "Laudo com satélite, sensor, datas, resoluções, bandas e metodologia"
    citacao: "satélite imageador e sensor utilizado, data das imagens, resolução espacial, resolução radiométrica e bandas utilizadas"
    citacoes_adicionais:
      - "metodologia utilizada para realizar o pré-processamento e o processamento da imagem"
      - "explicações acerca do modo como as imagens foram utilizadas para monitorar e fiscalizar as operações"
    resumo: "Toda checagem de sensoriamento remoto usada no laudo precisa carregar estes metadados."
    aplica_a: [laudo]
    avaliador: metadados_sensoriamento
    ferramentas: [serie_ndvi, anomalia_ndvi, sensoriamento_remoto]
    efeito:
      # Onde ler: resultado.metadados_laudo (serie_ndvi), resultado.metadados_sr ou o próprio resultado.
      blocos_metadados: [metadados_laudo, metadados_sr]
      campos_exigidos:
        satelite: {inciso: "4-b-I", aceita: [satelite, plataforma]}
        sensor: {inciso: "4-b-I", aceita: [sensor]}
        datas_imagens: {inciso: "4-b-I", aceita: [datas_imagens, datas]}
        resolucao_espacial: {inciso: "4-b-I", aceita: [resolucao_espacial_m, resolucao_m]}
        resolucao_radiometrica: {inciso: "4-b-I", aceita: [resolucao_radiometrica_bits, resolucao_radiometrica]}
        bandas: {inciso: "4-b-I", aceita: [bandas]}
        metodologia: {inciso: "4-b-II", aceita: [metodologia_processamento, metodologia]}
        uso_na_fiscalizacao: {inciso: "4-b-III", aceita: [uso_na_fiscalizacao, uso]}
    usado_por: [avaliar_regras]
    pedido: "completar os metadados de sensoriamento remoto da checagem (satélite, sensor, datas, resoluções, bandas, metodologia, uso)"
    criterios:
      verificado: "todas as checagens de sensoriamento têm os 8 metadados"
      pendente: "alguma checagem de sensoriamento sem metadado exigido"

  - id: MCR-2-7-item5-remoto-obrigatorio-300ha
    item: "MCR 2-7-5"
    tipo: requisito_metodo
    origem: norma
    titulo: "Sensoriamento remoto obrigatório: custeio/investimento, contratado a partir de 01/03/2026, área total > 300 ha"
    citacao: "os empreendimentos de custeio e investimento que, cumulativamente: a) forem financiados em operações contratadas a partir de 1º de março de 2026; e b) tenham área total superior a trezentos hectares."
    aplica_a: [operacao]
    condicao:
      todas:
        - {campo: operacao.finalidade, op: in, valor: [custeio, investimento]}
        - {campo: operacao.data_contratacao, op: gte, valor: 2026-03-01}
        - {campo: operacao.area_total_ha, op: gt, valor: 300}
    efeito: {metodo_obrigatorio: remoto}
    avaliador: sensoriamento_obrigatorio
    ferramentas: [serie_ndvi, anomalia_ndvi, sensoriamento_remoto]
    parametros: [PAR-area-total-usa-financiada, PAR-tentativas-inconclusivas-max]
    usado_por: [planejar_metodo, avaliar_regras]
    pedido: "executar a checagem de sensoriamento remoto da gleba (pastagem e instalações, item 9)"
    criterios:
      verificado: "obrigatório e há checagem de sensoriamento conclusiva sem divergência"
      divergente: "checagem de sensoriamento conclusiva indica incompatibilidade (ex.: sem pastagem)"
      pendente: "obrigatório e sem checagem; ou inconclusiva (item 10: complementar com outro método); ou área desconhecida"
      abstencao: "inconclusiva após o máximo de tentativas"

  - id: MCR-2-7-item6-verificacoes-previas
    item: "MCR 2-7-6"
    tipo: requisito_metodo
    origem: norma
    titulo: "Verificações remotas prévias à formalização (aptidão, duplicidade, vegetação nativa)"
    citacao: "previamente à formalização da operação, a instituição financeira deve adotar o método de sensoriamento remoto"
    resumo: "Informativa: etapa de concessão, fora da fiscalização em campo; o laudo pode citar o dossiê."
    aplica_a: [operacao]

  - id: MCR-2-7-item7-verificacoes-curso
    item: "MCR 2-7-7"
    tipo: requisito_metodo
    origem: norma
    titulo: "Verificações remotas ao longo da operação (inclui áreas vedadas do MCR 2-9)"
    citacao: "ao longo do curso da operação, a instituição financeira deve adotar o método de sensoriamento remoto"
    citacoes_adicionais:
      - "se há indícios de condução inadequada do empreendimento ou de não aplicação dos recursos do financiamento"
    resumo: "Informativa no regional; a alínea 'f'/'g' conecta com o rulebook mcr-2-9."
    aplica_a: [operacao]

  - id: MCR-2-7-item9-pecuaria-pastagem-instalacoes
    item: "MCR 2-7-9"
    tipo: requisito_evidencia
    origem: norma
    titulo: "Pecuária: apurar pastagem e instalações; contagem por satélite é facultada"
    citacao: "devendo ser apurada a existência de pastagem e de instalações compatíveis com o empreendimento, conforme o caso, facultada a contagem de animais por sensoriamento remoto"
    resumo: "Quando o item 5 se aplica a operação pecuária, o sensoriamento deve cobrir pastagem e instalações."
    aplica_a: [bovinos, cerca, curral, galpao]
    efeito: {objetos_sensoriamento: [pastagem, instalacoes], contagem_por_satelite: facultativa}
    evidencias: [satelite]
    usado_por: [planejar_metodo]

  - id: MCR-2-7-item10-inconclusivo-outros-metodos
    item: "MCR 2-7-10"
    tipo: requisito_metodo
    origem: norma
    titulo: "Sensoriamento inconclusivo exige outro método"
    citacao: "não dispensam a instituição financeira de adotar os demais métodos de que trata o item 3, em vista de informações inconclusivas levantadas pelo sensoriamento remoto"
    aplica_a: [operacao]
    efeito: {se_inconclusivo: [documental, presencial]}
    usado_por: [planejar_metodo, avaliar_regras]

  # ------------------------------------------------- gestão e independência
  - id: MCR-2-7-item12-amostragem
    item: "MCR 2-7-12"
    tipo: requisito_metodo
    origem: norma
    titulo: "Amostragem com critérios estatísticos"
    citacao: "o processo de amostragem deve observar critérios estatísticos"
    resumo: "Informativa: nível de carteira (triar_carteira), não de uma fiscalização."
    aplica_a: [carteira]

  - id: MCR-2-7-item14-terceirizacao
