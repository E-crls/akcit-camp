  item_normativo: 'NT 2024.003 v1.03 grupo ZF (guiaTransito: uma guia por NF-e; nGuia, série, UF); OP-bovinos-gta;
    MCR 2-5-10-b'
  o_que_prova: 'a GTA só vale cruzada com a nota: quando nenhuma GTA apresentada é a citada no grupo ZF, o laudo
    não fecha (pendência até a GTA citada aparecer)'
  o_que_nao_prova: 'falsidade da GTA (autenticidade só no SIDAGO/BDU, fora do escopo offline); nem que a GTA é de
    outra venda: o fiscal pode só não ter enviado a GTA citada, por isso é pendência e não acusação'
  adaptacao: fiscalização documental (sem vídeo); duas GTAs apresentadas (cargas 1 e 2) e a NF-e cita no grupo ZF
    uma terceira guia, de outra série
