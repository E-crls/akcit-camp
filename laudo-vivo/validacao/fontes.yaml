# Matriz de evidências de Problema e Validação (memorando interno de 16/10/2026, seção 3; REQ-56).
# Uma entrada por linha da matriz de validacao/README.md. Campos:
#   id, evidencia, url (lista; vazia = URL completa não registrada no repositório), data (da fonte),
#   prova, nao_prova, tipo (norma | dado_oficial | decisao_judicial | relatorio_tecnico | pesquisa |
#   mercado | caso_publico | imprensa | retroteste), reproducao (script ou arquivo do repositório, se houver),
#   estado: reproduzido (o script do repositório gera o número) | citado (vem da pesquisa do memorando;
#   reconferir a fonte antes de levar ao palco) | pendente.
# Datas no formato AAAA-MM-DD. Conferido em 2026-10-16.

conferido_em: 2026-10-16
evidencias:
  - id: 1
    evidencia: "Voto 166/2025-BCB (Voto do CMN 78/2025), itens 8, 13, 14 e 32"
    url: ["https://normativos.bcb.gov.br/Votos/CMN/202578/Voto_do_CMN_78_2025.pdf"]
    data: 2025-11-12
    prova: >-
      As IFs evoluíram pouco na verificação remota; o sensoriamento remoto não dispensa a verificação presencial
