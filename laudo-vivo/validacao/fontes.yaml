      - "https://www.bcb.gov.br/estabilidadefinanceira/exibenormativo?tipo=Instru%C3%A7%C3%A3o%20Normativa%20BCB&numero=758"
      - "https://www.bcb.gov.br/api/conteudo/app/normativos/exibenormativo?p1=Instru%C3%A7%C3%A3o%20Normativa%20BCB&p2=758"
    data: 2025-11-28
    data_complementar: {in_bcb_758_dou: 2026-07-10}
    prova: >-
      A IF paga e responde pela fiscalização, e a documentação fica à disposição do BCB; para reverter uma
      desclassificação, a IF precisa de documentação por operação.
    nao_prova: "Disposição de pagar pelo nosso produto."
    tipo: norma
    reproducao: "docs/normas/mcr_2_7.md; docs/normas/in_bcb_758.md; src/laudo/rulebooks/mcr_2_7.yaml"
    estado: citado
    observacao: >-
      IN BCB 758, de 08/07/2026 (DOU 10/07/2026, seção 1, p. 196), conferida em 2026-10-16 pela API do buscador
      de normativos: altera o MCR - Documento 1 (Sicor). Nota do campo 60-B, alínea c: o diretor responsável
      "deve registrar, para cada operação, a documentação comprobatória das justificativas para a reversão";
      alínea e: essa documentação fica "à disposição do BC". Texto literal (área de Regras) em
      docs/normas/in_bcb_758.md.

  - id: 3
    evidencia: "Análise própria do Sicor: desclassificações registradas por ano e motivo"
    url:
      - "https://www.bcb.gov.br/htms/sicor/DadosBrutos/sicor_desclassificacao.gz"
      - "https://www.bcb.gov.br/htms/sicor/MotivoDesclassificacao.csv"
    data: 2026-10-14  # Last-Modified da versão atual; a do memorando é de 2026-10-07 (snapshot)
    prova: >-
      Versão do memorando (07/10/2026): 4.553 desclassificações registradas em 2026 até 06/10 contra 4.072 em todo
      2025; motivo 013 ("aplicação não comprovada"): 349 em 2025 e 364 em 2026. Versão de 14/10/2026: 4.599 até
      13/10 contra 4.075; motivo 013: 349 e 368.
    nao_prova: >-
      Ilícito nem crescimento de comportamento: a série tem quebra de registro (2022 com 118 registros; motivo 999
      "Outro" cai de 64% para 29%). Dizer "desclassificações registradas" e comparar só 2026 parcial com 2025
      inteiro, sem multiplicadores.
    tipo: dado_oficial
    reproducao: "bench/desclassificacao/build.py; chaves desc.* e desc.memorando.* de docs/entregaveis/numeros.md"
    estado: reproduzido

  - id: 4
    evidencia: "Recorte GO do Sicor (desclassificações de 2024 a 2026)"
    url: ["https://www.bcb.gov.br/htms/sicor/DadosBrutos/sicor_desclassificacao.gz",
          "https://www.bcb.gov.br/htms/sicor/DadosBrutos/"]
    data: 2026-10-16  # data do cálculo
    prova: >-
      Motivo 013 é 14,5% dos registros de GO (82 de 564) contra 7,8% no país; custeio de aquisição e manutenção
      de animais em GO: 158 registros, R$ 169,5 mi desclassificados (2024 a 2026). No país, o custeio de
      aquisição desclassifica 5,2 operações por mil (coortes 2022–2024), 3,7 vezes a média; a compra de gado por
      investimento, 0,6 por mil, abaixo da média.
    nao_prova: >-
      Que o gado concentre as desclassificações: a pecuária tem 54% das operações e 58% dos registros
      (proporcional). Dentro dela, a aquisição de animais é sobrerrepresentada (26% das operações, 38% das
      operações desclassificadas), puxada pelo custeio de aquisição; a compra por investimento é
      sub-representada.
    tipo: dado_oficial
    reproducao: "bench/desclassificacao/resumo.json (versoes.*.janela_2024_2026, taxas_por_coorte, participacao)"
    estado: reproduzido

  - id: 5
    evidencia: "Fiscal-GO 2026: operações bovinas acima de 300 ha (MCR 2-7 item 5)"
    url: ["https://www.bcb.gov.br/htms/sicor/DadosBrutos/SICOR_OPERACAO_BASICA_ESTADO_2026.gz"]
    data: 2026-10-16  # reconferência
    prova: >-
      Só 301 de 19.009 operações bovinas de GO em 2026 caem no item 5 (sensoriamento remoto obrigatório: acima
      de 300 ha e emitidas a partir de 01/03/2026); as outras 98,4%, que são 90,3% do valor, ficam no espaço
      documental e presencial. Os 97,8% (87,4% do valor) são das operações até 300 ha (414 acima).
    nao_prova: "Que as operações fora do item 5 tenham problema."
    tipo: dado_oficial
    reproducao: >-
      bench/fiscal_go/fiscal_go_2026.parquet (colunas eh_pecuaria_bovina, exige_sensoriamento_remoto,
      acima_300ha, valor_rs)
    estado: reproduzido
    observacao: >-
      Reconferido em 2026-10-16 no parquet do repositório (301 e 414 de 19.009; 98,4%/90,3% e 97,8%/87,4%). O
      memorando juntou as duas leituras; no palco, "mais de 97%" vale para as duas. O observatório confirma a
      ordem de grandeza pelos itens com animais de GO: 97,3% até 300 ha em 2025 e 97,9% em 2026 (area_animais
      em bench/desclassificacao/resumo.json).

