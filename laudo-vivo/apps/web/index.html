<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#ffffff">
<title>Laudo Vivo</title>
<link rel="icon" href="icone.svg" type="image/svg+xml">
<link rel="stylesheet" href="vendor/leaflet-1.9.4/leaflet.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<a class="pular" href="#conteudo">Pular para o conteúdo</a>
<div class="cabecalho" id="cabecalho">
  <div id="faixa-demo" class="faixa-demo" role="note" hidden></div>
  <header class="topo">
    <a class="marca" href="#/carteira" aria-label="Laudo Vivo — início">
      <svg class="marca-ic" viewBox="0 0 32 32" aria-hidden="true"><rect x="2" y="2" width="28" height="28" rx="8" fill="currentColor"/><path d="M9 21c0-7 4.5-11.5 13.5-12-.5 8.5-5 12.5-13.5 12z" fill="none" stroke="#fff" stroke-width="2.2" stroke-linejoin="round"/><path d="M9 21l6.5-6.5" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/></svg>
      <span class="marca-txt"><strong>Laudo Vivo</strong><small>fiscalização do crédito rural</small></span>
    </a>
    <nav class="nav" aria-label="Seções">
      <a href="#/carteira" data-rota="carteira">Carteira</a>
      <a href="#/fis" data-rota="fis" id="nav-fis" hidden>Fiscalização</a>
      <a href="#/laudo" data-rota="laudo" id="nav-laudo" hidden>Laudo</a>
    </nav>
    <div class="topo-acoes">
      <div id="estado-api" class="estado-api" role="status" hidden></div>
      <button type="button" class="btn btn-fantasma btn-topo" id="btn-tecnico" aria-expanded="false" aria-controls="tecnico" title="Modelo, ferramentas, etapas, decisões da política e trace">
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 8l-4 4 4 4M16 8l4 4-4 4M13.5 5l-3 14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span class="rot">Detalhes técnicos</span><span class="ponto-tec" id="ponto-tec" aria-hidden="true"></span>
      </button>
      <button type="button" class="btn btn-fantasma btn-topo btn-apresentacao" id="btn-apresentacao" aria-pressed="false">
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4.5" width="18" height="12" rx="1.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 16.5V20M8 20h8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <span class="rot">Modo apresentação</span>
      </button>
    </div>
  </header>
</div>
<main id="conteudo" tabindex="-1"></main>
<aside id="tecnico" class="gaveta-tec" aria-labelledby="tecnico-titulo" hidden>
  <div class="gaveta-cab">
    <div>
      <h2 id="tecnico-titulo">Detalhes técnicos</h2>
      <p class="nota">Para auditoria e para a banca: o fiscal não precisa desta área.</p>
    </div>
    <button type="button" class="btn btn-icone btn-fantasma" data-fechar-tec aria-label="Fechar detalhes técnicos">
      <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
  </div>
  <div class="gaveta-corpo" id="tecnico-corpo"></div>
</aside>
<div id="selo-demo" class="selo-demo" aria-hidden="true" hidden></div>
<div id="anuncio" class="so-leitor" aria-live="polite" aria-atomic="true"></div>
<div id="anuncio-urgente" class="so-leitor" aria-live="assertive" aria-atomic="true"></div>
<div id="avisos" class="avisos" aria-live="polite"></div>
<dialog id="modal" class="modal" aria-labelledby="modal-titulo">
  <div class="modal-cab">
    <h2 id="modal-titulo">Detalhe</h2>
    <button type="button" class="btn btn-icone btn-fantasma" data-fechar aria-label="Fechar">✕</button>
  </div>
  <div class="modal-corpo" id="modal-corpo"></div>
</dialog>
<noscript><p class="noscript">O Laudo Vivo precisa de JavaScript ligado.</p></noscript>
<script src="vendor/leaflet-1.9.4/leaflet.js" defer></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
