[project]
name = "laudo-vivo"
version = "0.1.0"
description = "Agente de prova auditável para o crédito rural: fiscalização (MCR 2-7), exceções socioambientais (MCR 2-9) e perdas, com verificação, abstenção e laudo rastreável."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.12,<3.13"
dependencies = [
  "pydantic>=2.8",
  "pyyaml>=6",
  "httpx>=0.27",
  "numpy>=2.0",
  "pandas>=2.2",
  "pyarrow>=17",
  "shapely>=2.0",
  "pyproj>=3.6",
  "jinja2>=3.1",
  "lxml>=5.2",
  "pillow>=10.4,<13",
  "imagehash>=4.3",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "python-multipart>=0.0.9",
  "opentelemetry-sdk>=1.27",
]

[project.optional-dependencies]
geo = ["rasterio>=1.4", "pystac-client>=0.8"]
vision = ["onnxruntime>=1.19", "opencv-python-headless>=4.10,<5", "scipy>=1.13", "av>=12,<19"]
voice = ["faster-whisper>=1.1", "soundfile>=0.12"]  # TTS fica no navegador (Web Speech API, pt-BR)

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "hypothesis>=6.100"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/laudo"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "rede: testes que acessam a internet (pulados por padrão; LAUDO_TESTES_REDE=1)",
  "lento: testes lentos com vídeo real (LAUDO_LENTO=1 ou -m lento)",
]
